---
- name: Restaurer une archive applicative
  hosts: "{{ serveur | default('aucun-serveur-choisi') }}"
  become: true
  vars:
    restauration_archive: ""
    restauration_temporaire: /tmp/taylor-shift-restore
    restauration_aws_cli: /snap/bin/aws
  tasks:
    - name: Vérifier le nom de l'archive
      ansible.builtin.assert:
        that:
          - restauration_archive | length > 0
        fail_msg: "Fournir -e restauration_archive=/var/backups/taylor-shift/fichier.tar.gz"

    - name: Arrêter PrestaShop avant restauration
      ansible.builtin.command:
        cmd: docker stop taylor-shift-prestashop
      changed_when: true

    - name: Créer le dossier temporaire de restauration
      ansible.builtin.file:
        path: "{{ restauration_temporaire }}"
        state: directory
        mode: "0700"

    - name: Extraire l'archive SQL
      ansible.builtin.unarchive:
        src: "{{ restauration_archive }}"
        dest: "{{ restauration_temporaire }}"
        remote_src: true

    - name: Restaurer MariaDB locale
      ansible.builtin.shell: >-
        docker exec -i db sh -c
        'mariadb -uroot -p"$MYSQL_ROOT_PASSWORD" "{{ application_db_name }}"'
        < "{{ restauration_temporaire }}/database.sql"
      no_log: true
      when: application_use_local_database | default(false)
      changed_when: true

    - name: Lire le secret RDS
      ansible.builtin.command:
        cmd: >-
          {{ restauration_aws_cli }} secretsmanager get-secret-value
          --secret-id {{ application_db_secret_arn }}
          --query SecretString --output text
          --region {{ application_aws_region }}
      register: restauration_secret
      changed_when: false
      no_log: true
      when: not (application_use_local_database | default(false))

    - name: Restaurer RDS
      ansible.builtin.shell: >-
        mariadb -h "{{ (restauration_secret.stdout | from_json).host }}"
        -P "{{ (restauration_secret.stdout | from_json).port }}"
        -u "{{ (restauration_secret.stdout | from_json).username }}"
        "{{ (restauration_secret.stdout | from_json).database }}"
        < "{{ restauration_temporaire }}/database.sql"
      environment:
        MYSQL_PWD: "{{ (restauration_secret.stdout | from_json).password }}"
      no_log: true
      when: not (application_use_local_database | default(false))
      changed_when: true

    - name: Redémarrer PrestaShop
      ansible.builtin.command:
        cmd: docker start taylor-shift-prestashop
      changed_when: true

    - name: Supprimer les fichiers temporaires
      ansible.builtin.file:
        path: "{{ restauration_temporaire }}"
        state: absent
