---
- name: Désactiver l'authentification SSH par mot de passe
  ansible.builtin.lineinfile:
    path: "{{ durcissement_ssh_config }}"
    regexp: '^#?PasswordAuthentication '
    line: PasswordAuthentication no
    validate: /usr/sbin/sshd -t -f %s
  notify: Recharger SSH

- name: Interdire root par mot de passe
  ansible.builtin.lineinfile:
    path: "{{ durcissement_ssh_config }}"
    regexp: '^#?PermitRootLogin '
    line: PermitRootLogin prohibit-password
    validate: /usr/sbin/sshd -t -f %s
  notify: Recharger SSH

- name: Limiter le forwarding SSH aux tunnels locaux
  ansible.builtin.lineinfile:
    path: "{{ durcissement_ssh_config }}"
    regexp: '^#?AllowTcpForwarding '
    line: AllowTcpForwarding local
    validate: /usr/sbin/sshd -t -f %s
  notify: Recharger SSH

- name: Durcir les réglages réseau du noyau
  ansible.posix.sysctl:
    name: "{{ item.nom }}"
    value: "{{ item.valeur }}"
    sysctl_file: /etc/sysctl.d/90-durcissement.conf
    reload: true
  loop: "{{ durcissement_sysctl }}"
  loop_control:
    label: "{{ item.nom }} = {{ item.valeur }}"
