---
- name: Configurer les serveurs applicatifs
  hosts: webservers
  become: true
  gather_facts: false
  pre_tasks:
    - name: Installer Python sur l'image Floci
      ansible.builtin.raw: >-
        test -x /usr/bin/python3 ||
        (apt-get update && apt-get install -y python3)
      changed_when: false

    - name: Collecter les facts après le bootstrap
      ansible.builtin.setup:
  roles:
    - durcissement
    - pare_feu
    - application
    - nginx
    - node_exporter
    - sauvegarde
